[package]
name = "codex-acp-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-client-protocol = "=0.10.2"
anyhow = "1"
async-trait = "0.1"
codex-app-server-protocol = { git = "https://github.com/openai/codex", tag = "rust-v0.137.0" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
base64 = "0.22.1"

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"
